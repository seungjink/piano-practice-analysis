name: Update Report Index

on:
  push:
    branches: ["main"]
    paths:
      - "reports/*.md"
      - "scripts/build_index.py"
    paths-ignore:
      - "reports/index.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate report index
        run: python scripts/build_index.py

      - name: Commit updated index
        run: |
          if git diff --quiet -- reports/index.json; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index.json
          git commit -m "Update report index"
          git push
